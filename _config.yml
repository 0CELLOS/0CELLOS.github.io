# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 小站
subtitle: '记录喜欢的一切'
description: '一个关于摄影、音乐、阅读与生活的小角落'
keywords: 博客, 摄影, 音乐, 阅读, 生活
author: 0CELLOS
language: zh-CN
timezone: Asia/Shanghai

# URL
## 把 username 替换成你的 GitHub 用户名
url: https://0cellos.github.io
permalink: posts/:hash/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 随笔
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude
include:
exclude:
ignore:

# Extensions
theme: butterfly

# Deployment
deploy:
  type: git
  repo: https://github.com/0CELLOS/0CELLOS.github.io.git
  branch: main

# APlayer 全局音乐播放器
aplayer:
  meting: true
  asset_inject: false
