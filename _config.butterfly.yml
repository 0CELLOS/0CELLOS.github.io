# ===================================
# Butterfly 主题配置 - 小站
# ===================================

# ---------- 导航 ----------
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  音乐: /music/ || fas fa-music
  关于: /about/ || fas fa-heart

# ---------- 社交链接 ----------
social:
  fab fa-github: https://github.com/0CELLOS || Github || '#24292e'
  fas fa-envelope: mailto:你的邮箱@example.com || Email || '#4a7dbe'

# ---------- 图片 ----------
favicon: /img/favicon.png

avatar:
  img: https://api.dicebear.com/7.x/adventurer/svg?seed=Felix
  effect: true

disable_top_img: false

default_top_img: https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1920&q=80

index_img: https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1920&q=80
archive_img:
tag_img:
category_img:
footer_img: false

# 暗色全屏背景
background:
  - https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1920&q=80
  - https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920&q=80
  - https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - https://picsum.photos/800/450?random=1
    - https://picsum.photos/800/450?random=2
    - https://picsum.photos/800/450?random=3

error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

error_404:
  enable: true
  subtitle: '页面走丢了...'
  background: /img/error-page.png

# ---------- 文章元信息 ----------
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# ---------- 首页设置 ----------
index_site_info_top:
index_top_img_height:

subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 用镜头和文字，记录喜欢的一切 📷
    - 生活不止眼前的代码 ✨
    - 一杯咖啡，一首歌，一篇文 ☕🎵
    - 保持热爱，奔赴山海 🌊

index_layout: 3

index_post_content:
  method: 3
  length: 300

# ---------- 文章页 ----------
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: false

post_pagination: 1

# ---------- 侧边栏 ----------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 记录喜欢的一切
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/0CELLOS
  card_announcement:
    enable: true
    content: 🎵 欢迎来到我的小站
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# ---------- 暗色模式 ----------
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# ---------- 代码块 ----------
code_blocks:
  theme: darker
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# ---------- 搜索 ----------
search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8

# ---------- 页脚 ----------
footer:
  owner:
    enable: true
    since: 2025
  copyright:
    enable: false
  custom_text: <span>这个世界很美，值得记录</span>

# ---------- 全局设置 ----------
copy:
  enable: true
  copyright:
    enable: false

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# ---------- 字数统计 ----------
wordcount:
  enable: false

# ---------- 全局音乐播放器 ----------
aplayer:
  enable: true
  # QQ音乐歌单ID，换成你自己的歌单即可
  meting_id: 8540364786
  meting_api: https://meting.qjqq.cn
  meting_type: playlist
  # 播放器位置：fixed=左下角悬浮
  aplayer_cdn: https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js
  meting_cdn: https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js
